name: 3 — Weekly cheatsheet generation

on:
  schedule:
    # - cron: '45 7 * * 6'
  workflow_dispatch:

jobs:
  cheatsheet:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send cheatsheet
        run: python scripts/generate_cheatsheet.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit used topics tracker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f outputs/used_cheatsheet_topics.json
          git add -f outputs/latest_cheatsheet.json || true
          git diff --staged --quiet || git commit -m "Cheatsheet: $(date +%Y-%m-%d)"
          git push origin HEAD:main
