name: 2 — Generate images and send to Telegram

on:
  schedule:
    # - cron: '15 7 * * 6'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest commits
        run: git pull origin main

      - name: Check posts.json exists
        run: |
          if [ ! -f outputs/posts.json ]; then
            echo "ERROR: outputs/posts.json not found."
            echo "Run Workflow 1 first, then re-run this workflow."
            exit 1
          fi
          echo "posts.json found. Post count: $(python3 -c "import json; d=json.load(open('outputs/posts.json')); print(len(d.get('posts',[])))")"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate images and send to Telegram
        run: python scripts/generate_and_send.py
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
