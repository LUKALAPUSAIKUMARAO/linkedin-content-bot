name: 1 — Weekly content generation

on:
  schedule:
    - cron: '0 7 * * 6'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch trends
        run: python scripts/fetch_trends.py

      - name: Generate 7 posts
        run: python scripts/generate_posts.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Save to Google Sheets
        run: python scripts/save_to_sheets.py
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Commit outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p outputs
          git add outputs/
          git diff --staged --quiet || git commit -m "Weekly content $(date +%Y-%m-%d)"
          git push origin HEAD:main
